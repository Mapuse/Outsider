[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "target-cpu=x86-64-v2",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-target",
    "-C", "link-arg=x86_64-unknown-linux-musl",
]

[target.aarch64-unknown-linux-musl]
linker = "/home/m/Outsider/toolchains/zig-aarch64-musl-cc"
rustflags = [
    "-C", "link-self-contained=no",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-target",
    "-C", "link-arg=aarch64-unknown-linux-musl",
]