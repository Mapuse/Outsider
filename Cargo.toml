[package]
name = "outsider"
version = "0.7.0"
edition = "2024"

[features]
default = []
python = ["cps/python"]

[[bin]]
name = "ous"
path = "src/main.rs"

[lib]
name = "ous"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
zstd = "0.13"
tar = "0.4"
sha1 = "0.10"
sha2 = "0.11.0"
md-5 = "0.10"
regex = "1.12.4"
toml = "1.1"
cps = { git = "https://github.com/Mapuse/CPS", rev = "c4ba21e185398558052acec3f0b4619b4e8c0678", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
