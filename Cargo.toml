[package]
name = "outsider"
version = "0.7.0"
edition = "2024"

[[bin]]
name = "ous"
path = "src/main.rs"

[lib]
name = "ous"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
zstd = "0.13"
tar = "0.4"
sha1 = "0.10"
sha2 = "0.11.0"
md-5 = "0.10"
chrono = "0.4.45"
regex = "1.12.4"
toml = "1.1"
pyo3 = "0.25"
